name: CI — Backend Tests, Web Build & Flutter Checks

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  backend-tests:
    name: Django Backend Check & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atbuconnect_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Check migrations & Django system check
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py check
      - name: Run Django automated test suite
        run: python manage.py test advertising accounts library staffapp communities config.tests_cenet_modules

  web-build:
    name: React Web Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atbuConnect
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: atbuConnect/package-lock.json
      - name: Install & Build
        run: |
          npm ci
          npm run build

  flutter-checks:
    name: Flutter Analyze & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: campusnetwork_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter pub get, analyze & test
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
