name: campusnetwork_flutter
description: CampusNetwork (Cenet) — Flutter mobile app with Telegram-grade liquid UI & Django parity.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  cached_network_image: ^3.4.1
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  file_picker: ^8.1.4
  share_plus: ^10.1.2
  url_launcher: ^6.3.1
  permission_handler: ^11.3.1
  path_provider: ^2.1.5
  open_filex: ^4.5.0
  flutter_local_notifications: ^18.0.1
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  web_socket_channel: ^3.0.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
